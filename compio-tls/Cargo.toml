[package]
name = "compio-tls"
version = "0.10.0"
description = "TLS adaptor with compio"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "net", "tls"]
readme = "README.md"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
native-tls = { workspace = true, optional = true, features = ["alpn"] }
rustls = { workspace = true, default-features = false, optional = true, features = [
    "logging",
    "std",
    "tls12",
] }
compio-py-dynamic-openssl = { workspace = true, optional = true }

futures-rustls = { workspace = true, default-features = false, optional = true, features = [
    "logging",
    "tls12",
] }
futures-util = { workspace = true, features = ["io"] }
compio-buf = { workspace = true, optional = true }
compio-io = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }

[dev-dependencies]
compio-runtime = { workspace = true }
compio-net = { workspace = true }
# The workspace pins compio-driver with default-features = false, which selects
# the stub driver on Linux. Tests need a real one.
compio-driver = { workspace = true, features = ["io-uring"] }
compio-macros = { workspace = true }

rand = "0.10.0"
rcgen = { workspace = true }
rsa = "0.10.0-rc.17"
rustls = { workspace = true, default-features = false, features = ["ring"] }
rustls-native-certs = { workspace = true }
socket2 = { workspace = true }
tempfile = { workspace = true }

futures-rustls = { workspace = true, default-features = false, features = [
    "ring",
] }

[features]
default = ["native-tls"]
all = ["native-tls", "rustls"]
rustls = ["dep:rustls", "dep:futures-rustls"]
# Prototype: drive rustls as a sans-io state machine on compio's own IO
# traits, with no futures::AsyncRead in between. See src/sansio.rs.
rustls-sansio = ["rustls", "dep:compio-buf", "dep:compio-io"]
native-tls = ["dep:native-tls", "dep:pin-project-lite"]
native-tls-vendored = ["native-tls/vendored"]
py-dynamic-openssl = ["dep:compio-py-dynamic-openssl", "dep:pin-project-lite"]

ring = ["rustls", "rustls/ring", "futures-rustls/ring"]
