name: TestKani

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - master
    paths:
      - 'compio-buf/**/*.rs'
      - 'compio-buf/Cargo.toml'
      - 'compio-io/**/*.rs'
      - 'compio-io/Cargo.toml'
      - '.github/workflows/ci_test_kani.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'compio-buf/**/*.rs'
      - 'compio-buf/Cargo.toml'
      - 'compio-io/**/*.rs'
      - 'compio-io/Cargo.toml'
      - '.github/workflows/ci_test_kani.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test_kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: model-checking/kani-github-action@v1
        with:
          working-directory: compio-io
