[package]
name = "compio-executor"
version = "0.1.3"
description = "Executor for compio"
categories = ["asynchronous"]
keywords = ["async", "executor"]
readme = "README.md"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
compio-log = { workspace = true }

compio-send-wrapper = { workspace = true }
crossbeam-queue = { workspace = true }
slotmap = { workspace = true }

# Console
tracing = { workspace = true, optional = true }

# dial9 flight recorder
dial9-core = { workspace = true, optional = true }
dial9-trace-format = { workspace = true, optional = true }

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["checkpoint"] }

[dev-dependencies]
criterion = { workspace = true }
iai-callgrind = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["resource", "signal"] }

[features]
enable_log = ["compio-log/enable_log"]

# Instrumentation for `tokio-console`. See the `console` module.
console = ["dep:tracing"]

# Instrumentation for the `dial9` flight recorder. See the `dial9` module.
dial9 = ["dep:dial9-core", "dep:dial9-trace-format"]

[[bench]]
name = "schedule"
harness = false

[[bench]]
name = "schedule_iai"
harness = false

[[example]]
name = "dial9"
required-features = ["dial9"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
